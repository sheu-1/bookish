{% extends 'base.html' %}

{% block title %}Delivery Details — bookish{% endblock %}

{% block content %}
<section class="checkout-section">
  <div class="container" style="max-width: 820px;">
    <nav class="shop-breadcrumb" style="margin-bottom: 20px;">
      <a href="{{ url_for('cart.view') }}" style="color: var(--ink); opacity: 0.8;">Cart</a>
      <span>/</span>
      <span style="font-weight: 800;">Delivery Details</span>
    </nav>

    <h1 class="checkout-page-title">Delivery details</h1>

    <div class="card checkout-card-panel">
      <form action="{{ url_for('payments.checkout_details') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="checkout-form-grid">
          <div>
            <label class="form-label">Recipient Full Name *</label>
            <input type="text" name="name" required value="{{ form_data.name or '' }}" placeholder="Jane Mwangi" class="newsletter-input" style="width: 100%;">
          </div>
          <div>
            <label class="form-label">Email Address (for receipt) *</label>
            <input type="email" name="email" required value="{{ form_data.email or '' }}" placeholder="jane@example.com" class="newsletter-input" style="width: 100%;">
          </div>
        </div>

        <div class="checkout-form-grid">
          <div>
            <label class="form-label">Phone Number (M-Pesa / Delivery) *</label>
            <input type="tel" name="phone" required value="{{ form_data.phone or '' }}" placeholder="0712345678 or +254..." class="newsletter-input" style="width: 100%;">
          </div>
          <div>
            <label class="form-label">Town / County / City *</label>
            <input type="text" name="city" value="Nairobi" class="newsletter-input" style="width: 100%;">
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <label class="form-label">Street Address / Building / Apartment *</label>
          <textarea name="address" required rows="2" placeholder="e.g. Westlands, Apex Towers, 4th Floor, Apt 4B" class="newsletter-input" style="width: 100%; height: auto; padding: 14px; border-radius: 18px;">{{ form_data.address or '' }}</textarea>
        </div>

        <div style="margin-bottom: 32px;">
          <label class="form-label">Special Delivery Notes (Optional)</label>
          <textarea name="notes" rows="2" placeholder="e.g. Leave with gate security if not home" class="newsletter-input" style="width: 100%; height: auto; padding: 14px; border-radius: 18px;">{{ form_data.notes or '' }}</textarea>
        </div>

        <div class="checkout-actions-row">
          <a href="{{ url_for('cart.view') }}" class="back-link">&larr; Back to cart</a>
          <button type="submit" class="btn btn-tangerine btn-lg checkout-submit-btn">
            <span>Continue to payment &rarr;</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
