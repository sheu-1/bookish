{% if book.cover_image %}
  <div class="book-cover book-cover-img-wrap">
    <img src="{{ book.cover_image }}" 
         alt="{{ book.title }} by {{ book.author }}" 
         class="book-cover-real-img" 
         loading="lazy"
         onerror="this.parentElement.style.display='none'; if(this.parentElement.nextElementSibling) this.parentElement.nextElementSibling.style.display='flex';">
  </div>
  <div class="book-cover" style="display: none; background-color: {{ book.cover_bg }}; color: {{ book.cover_fg }};">
    <div class="book-cover-title">{{ book.title }}</div>
    <div class="book-cover-author">{{ book.author }}</div>
    <div class="book-cover-shape shape-{{ book.cover_shape }}" style="background-color: {{ book.cover_accent }};"></div>
  </div>
{% else %}
  <div class="book-cover" style="background-color: {{ book.cover_bg }}; color: {{ book.cover_fg }};">
    <div class="book-cover-title">{{ book.title }}</div>
    <div class="book-cover-author">{{ book.author }}</div>
    <div class="book-cover-shape shape-{{ book.cover_shape }}" style="background-color: {{ book.cover_accent }};"></div>
  </div>
{% endif %}
