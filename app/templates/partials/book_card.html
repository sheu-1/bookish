<div class="book-grid-card">
  {% if book.tag %}
    <span class="book-card-tag">{{ book.tag }}</span>
  {% endif %}
  <a href="{{ url_for('catalog.product', slug=book.slug) }}" class="book-card-link">
    {% include 'partials/cover.html' %}
  </a>
  <div class="book-details">
    <a href="{{ url_for('catalog.product', slug=book.slug) }}" class="book-title">
      {{ book.title }}
    </a>
    <div class="book-author">by {{ book.author }}</div>
    <div class="book-footer">
      <div class="book-price">{{ book.price_kes | kes }}</div>
      <form action="{{ url_for('cart.add') }}" method="POST" class="add-to-cart-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="book_id" value="{{ book.id }}">
        <input type="hidden" name="quantity" value="1">
        <button type="submit" class="book-add-btn" aria-label="Add {{ book.title }} to cart" title="Add to bag">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
