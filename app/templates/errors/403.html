{% extends 'base.html' %}

{% block title %}Access Denied — bookish{% endblock %}

{% block content %}
<section style="padding: 80px 0 120px; text-align: center;">
  <div class="container" style="max-width: 600px;">
    <div class="card" style="padding: 56px 40px;">
      <span class="hero-pill-tag" style="background-color: var(--pink); margin-bottom: 16px;">403 Forbidden</span>
      <h1 style="font-size: 48px; margin-bottom: 16px;">Access restricted</h1>
      <p style="color: var(--muted); font-size: 18px; margin-bottom: 32px;">
        You don't have permission to access this area of the bookstore.
      </p>
      <a href="{{ url_for('catalog.home') }}" class="btn btn-tangerine btn-lg">Back to Home</a>
    </div>
  </div>
</section>
{% endblock %}
