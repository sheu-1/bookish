{% extends 'base.html' %}

{% block title %}Create Account — bookish{% endblock %}

{% block content %}
<section style="padding: 60px 0 100px;">
  <div class="container" style="max-width: 520px;">
    <div class="card" style="padding: 44px 36px;">
      <h1 style="font-size: 38px; margin-bottom: 8px;">Create account</h1>
      <p style="color: var(--muted); margin-bottom: 28px;">Join the bookish community for faster checkout and order tracking.</p>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 700; margin-bottom: 8px;">Full Name *</label>
          <input type="text" name="name" required placeholder="Jane Mwangi" class="newsletter-input" style="width: 100%;">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 700; margin-bottom: 8px;">Email Address *</label>
          <input type="email" name="email" required placeholder="you@example.com" class="newsletter-input" style="width: 100%;">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 700; margin-bottom: 8px;">Phone Number (optional)</label>
          <input type="tel" name="phone" placeholder="+254 712 345 678" class="newsletter-input" style="width: 100%;">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 700; margin-bottom: 8px;">Password *</label>
          <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" class="newsletter-input" style="width: 100%;">
        </div>

        <div style="margin-bottom: 28px;">
          <label style="display: block; font-weight: 700; margin-bottom: 8px;">Confirm Password *</label>
          <input type="password" name="confirm_password" required minlength="6" placeholder="Repeat password" class="newsletter-input" style="width: 100%;">
        </div>

        <button type="submit" class="btn btn-tangerine btn-lg" style="width: 100%;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 15px; color: var(--muted);">
        Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--violet); font-weight: 700; text-decoration: underline;">Sign In</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
