<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paystack Checkout (Simulation) — bookish</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <style>
    body {
      background-color: rgba(27, 19, 64, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .paystack-modal {
      background-color: #FFFFFF;
      border: 3px solid var(--ink);
      border-radius: 28px;
      width: 100%;
      max-width: 460px;
      padding: 36px;
      box-shadow: 8px 8px 0 var(--ink);
      text-align: center;
    }
    .paystack-badge {
      display: inline-block;
      background-color: #0BA4DB;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .channel-box {
      border: 2px solid var(--ink);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
      background-color: var(--cream);
    }
  </style>
</head>
<body>
  <div class="paystack-modal">
    <span class="paystack-badge">Paystack Sandbox / Demo Mode</span>
    <h2 style="font-size: 28px; margin-bottom: 6px;">bookish Ltd</h2>
    <p style="font-size: 15px; color: var(--muted); margin-bottom: 24px;">Secure checkout for Reference <code>{{ order.reference }}</code></p>

    <div style="font-family: var(--font-display); font-size: 42px; font-weight: 800; color: var(--ink); margin-bottom: 24px;">
      {{ order.total_kes | kes }}
    </div>

    <form method="POST" action="{{ url_for('payments.mock_checkout', reference=order.reference) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="channel-box">
        <div style="font-weight: 700; margin-bottom: 10px;">Select Channel:</div>
        <div style="display: flex; gap: 16px;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600;">
            <input type="radio" name="channel" value="card" checked> Card (Visa / MC)
          </label>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600;">
            <input type="radio" name="channel" value="mobile_money"> M-Pesa
          </label>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button type="submit" name="action" value="pay" class="btn btn-tangerine btn-lg" style="width: 100%;">
          Authorize &amp; Pay {{ order.total_kes | kes }}
        </button>

        <button type="submit" name="action" value="fail" class="btn btn-white" style="width: 100%;">
          Simulate Decline / Card Error
        </button>

        <button type="submit" name="action" value="abandon" style="background: none; border: none; color: #777; cursor: pointer; font-weight: 600; padding: 8px;">
          Cancel and return to store
        </button>
      </div>
    </form>

    <div style="margin-top: 24px; font-size: 12px; color: var(--muted);">
      🔒 Demonstrating server-side transaction verification with Paystack.
    </div>
  </div>
</body>
</html>
